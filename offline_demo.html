<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCIAL·NET — 离线前端演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13;
  --panel:#10161d;
  --panel2:#141b23;
  --border:#1c2530;
  --text:#dce6ee;
  --muted:#5c6b78;
  --muted2:#3a4550;
  --cyan:#35d4e0;
  --cyan-dim:#1a6b73;
  --copper:#d98e4a;
  --copper-dim:#6b4a28;
  --teal:#59e6b0;
  --teal-dim:#2a6b52;
  --danger:#e2555f;
  --mono:'IBM Plex Mono', monospace;
  --sans:'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden;}
body{display:flex; flex-direction:column;}

/* ===== 顶部工具条 ===== */
#topbar{
  height:52px; flex:0 0 auto; display:flex; align-items:center; gap:18px;
  padding:0 18px; border-bottom:1px solid var(--border); background:var(--panel);
  z-index:20;
}
#topbar .brand{font-family:var(--mono); font-size:14px; letter-spacing:1.5px; color:var(--cyan); font-weight:600;}
#topbar .brand span{color:var(--muted);}
.seg{display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.seg button{
  background:transparent; border:none; color:var(--muted); font-family:var(--mono);
  font-size:12px; padding:7px 12px; cursor:pointer; transition:all .15s;
}
.seg button.active{background:var(--cyan-dim); color:#eafcff;}
.seg button:not(.active):hover{background:var(--panel2); color:var(--text);}
.iconbtn{
  width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--panel2);
  color:var(--muted); font-family:var(--mono); font-size:15px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; transition:all .15s;
}
.iconbtn:hover{border-color:var(--cyan-dim); color:var(--cyan);}
#hint{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted2); letter-spacing:.3px;
  white-space:nowrap;
}
#hint kbd{
  background:var(--panel2); border:1px solid var(--border); border-radius:3px; padding:1px 5px;
  color:var(--muted); font-size:10px;
}

/* ===== 主体 ===== */
#main{flex:1; display:flex; min-height:0;}
#canvasWrap{flex:1; position:relative; overflow:hidden; background:
  radial-gradient(circle at 30% 20%, rgba(53,212,224,0.05), transparent 45%),
  radial-gradient(circle at 80% 80%, rgba(217,142,74,0.04), transparent 45%),
  var(--bg);
}
#canvasWrap svg{width:100%; height:100%; display:block; cursor:grab;}
#canvasWrap svg.dragging{cursor:grabbing;}

.node-label{
  font-family:var(--mono); font-size:9.5px; fill:var(--muted); pointer-events:none;
  user-select:none;
}
.node-label.selected{fill:var(--text); font-weight:600; font-size:11px;}
.edge-line{stroke:#22303c; stroke-width:1; opacity:.55;}
.edge-line.dim{opacity:.08;}
.edge-line.circle-highlight{stroke:var(--cyan); stroke-width:1.6; opacity:.9;}
.edge-line.path-highlight{stroke:var(--copper); stroke-width:2.6; opacity:1; stroke-dasharray:6 4;}

/* 状态角标 */
#statusbar{
  position:absolute; left:14px; bottom:12px; font-family:var(--mono); font-size:11px;
  color:var(--muted2); pointer-events:none; line-height:1.6;
}
#statusbar b{color:var(--muted);}
#scanlegend{
  position:absolute; right:14px; bottom:12px; font-family:var(--mono); font-size:10.5px;
  color:var(--muted2); text-align:right; line-height:1.7; pointer-events:none;
}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:-1px;}

/* ===== 右侧面板 ===== */
#sidebar{
  width:338px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--border);
  overflow-y:auto; padding:14px 14px 40px;
}
#sidebar::-webkit-scrollbar{width:6px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}

.panel{
  border:1px solid var(--border); border-radius:8px; background:var(--panel2);
  margin-bottom:12px; overflow:hidden;
}
.panel > .ph{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
  border-bottom:1px solid var(--border); cursor:pointer; user-select:none;
}
.panel > .ph .tt{font-family:var(--mono); font-size:11.5px; letter-spacing:.5px; color:var(--cyan); font-weight:600;}
.panel > .ph .req{font-family:var(--mono); font-size:9.5px; color:var(--muted2);}
.panel > .pb{padding:12px; font-size:12.5px; line-height:1.55;}
.panel.collapsed > .pb{display:none;}
.panel > .ph .chev{color:var(--muted2); font-size:10px; transition:transform .15s;}
.panel.collapsed > .ph .chev{transform:rotate(-90deg);}

label.small{font-family:var(--mono); font-size:10.5px; color:var(--muted); display:block; margin-bottom:4px;}
input[type=text]{
  width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px;
  color:var(--text); font-family:var(--mono); font-size:12px; padding:7px 9px; outline:none;
}
input[type=text]:focus{border-color:var(--cyan-dim);}
.row{display:flex; gap:8px; margin-bottom:8px;}
.row > div{flex:1;}
button.action{
  width:100%; background:var(--cyan-dim); border:1px solid var(--cyan-dim); color:#eafcff;
  font-family:var(--mono); font-size:12px; font-weight:600; padding:8px; border-radius:5px;
  cursor:pointer; letter-spacing:.3px; transition:all .15s;
}
button.action:hover{background:var(--cyan); border-color:var(--cyan); color:#04222a;}
button.ghost{
  width:100%; background:transparent; border:1px solid var(--border); color:var(--muted);
  font-family:var(--mono); font-size:11.5px; padding:7px; border-radius:5px; cursor:pointer; margin-top:6px;
}
button.ghost:hover{border-color:var(--muted); color:var(--text);}

.kv{display:flex; justify-content:space-between; padding:3px 0; font-family:var(--mono); font-size:11.5px;}
.kv .k{color:var(--muted);}
.kv .v{color:var(--text);}
.badge{
  display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:10px;
  font-weight:600; letter-spacing:.3px;
}
.badge.core{background:rgba(217,142,74,.18); color:var(--copper);}
.badge.active{background:rgba(53,212,224,.15); color:var(--cyan);}
.badge.edge{background:rgba(92,107,120,.18); color:var(--muted);}

.taglist{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
.tag{
  font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:4px; background:var(--bg);
  border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all .15s;
}
.tag:hover{border-color:var(--cyan-dim); color:var(--cyan);}
.tag.copper{border-color:var(--copper-dim); color:var(--copper);}
.tag.teal{border-color:var(--teal-dim); color:var(--teal);}
.empty{color:var(--muted2); font-size:11.5px; font-style:normal;}

input[type=range]{width:100%; accent-color:var(--cyan); margin:6px 0;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.switch{
  width:34px; height:18px; border-radius:10px; background:var(--border); position:relative; cursor:pointer;
  transition:background .15s; flex:0 0 auto;
}
.switch.on{background:var(--cyan-dim);}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:var(--muted); transition:all .15s;
}
.switch.on::after{left:18px; background:var(--cyan);}

.statgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;}
.statcell{border:1px solid var(--border); border-radius:6px; padding:8px 4px; text-align:center;}
.statcell .n{font-family:var(--mono); font-size:16px; font-weight:600;}
.statcell .l{font-family:var(--mono); font-size:9px; color:var(--muted); margin-top:2px;}

::selection{background:var(--cyan-dim);}
</style>
</head>
<body>
<div style="padding:6px 18px;background:#1a6b73;font-size:12px">离线前端演示 · 使用内嵌技术标签关系与随机模拟坐标 · 不连接 Java 后端</div>

<div id="topbar">
  <div class="brand">SOCIAL·NET <span>/ 关系遥测终端</span></div>
  <div class="seg" id="viewSeg">
    <button data-view="topo" class="active">拓扑视图</button>
    <button data-view="geo">地理视图</button>
  </div>
  <div class="iconbtn" id="zoomIn" title="放大 (+)">+</div>
  <div class="iconbtn" id="zoomOut" title="缩小 (-)">&minus;</div>
  <div class="iconbtn" id="zoomReset" title="重置视图 (Esc)">&#8635;</div>
  <div id="hint">拖拽平移 · 滚轮缩放 · 拖节点重新排布 · <kbd>&larr;&uarr;&rarr;&darr;</kbd>平移 · <kbd>+/-</kbd>缩放 · <kbd>/</kbd>搜索 · <kbd>Esc</kbd>清除</div>
</div>

<div id="main">
  <div id="canvasWrap">
    <svg id="svg" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet">
      <g id="viewport">
        <g id="edgeLayer"></g>
        <g id="scanLayer"></g>
        <g id="nodeLayer"></g>
        <g id="labelLayer"></g>
      </g>
    </svg>
    <div id="statusbar"></div>
    <div id="scanlegend">
      <div><span class="dot" style="background:var(--copper)"></span>核心人物</div>
      <div><span class="dot" style="background:var(--cyan)"></span>活跃人物</div>
      <div><span class="dot" style="background:var(--muted2)"></span>边缘人物</div>
    </div>
  </div>

  <div id="sidebar">

    <div class="panel" id="p-path">
      <div class="ph"><span class="tt">路径查询</span><span class="req">需求(3)</span></div>
      <div class="pb">
        <label class="small">起点</label>
        <input type="text" id="pathA" list="nameList" placeholder="输入或点击图中节点">
        <label class="small" style="margin-top:8px">终点</label>
        <input type="text" id="pathB" list="nameList" placeholder="输入或点击图中节点">
        <datalist id="nameList"></datalist>
        <button class="action" id="btnPath" style="margin-top:10px">查找最短联系路径</button>
        <div id="pathResult" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="panel" id="p-detail">
      <div class="ph"><span class="tt">节点详情</span><span class="req">需求(1)(2)</span></div>
      <div class="pb" id="detailBody"><span class="empty">点击图中任意节点查看详情</span></div>
    </div>

    <div class="panel" id="p-circle">
      <div class="ph"><span class="tt">交往圈子</span><span class="req">需求(6)</span></div>
      <div class="pb" id="circleBody"><span class="empty">选中一个节点后显示其直接联系人</span></div>
    </div>

    <div class="panel" id="p-nearby">
      <div class="ph"><span class="tt">附近信号 / 中间人触达</span><span class="req">需求(4)</span></div>
      <div class="pb">
        <div class="toggle-row">
          <label class="small" style="margin:0">显示扫描半径圈</label>
          <div class="switch" id="scanToggle"></div>
        </div>
        <label class="small">搜索半径：<span id="radiusVal">15</span></label>
        <input type="range" id="radiusSlider" min="3" max="60" value="15">
        <div style="font-size:10.5px;color:var(--muted2);margin:4px 0 8px">地理视图下拖动节点可模拟"位置移动"，附近列表会实时刷新</div>
        <div id="nearbyBody"><span class="empty">先在图中选中一个节点</span></div>
      </div>
    </div>

    <div class="panel" id="p-stats">
      <div class="ph"><span class="tt">核心 / 活跃 / 边缘</span><span class="req">需求(5)</span></div>
      <div class="pb">
        <div class="statgrid" id="statGrid"></div>
        <div style="margin-top:10px">
          <label class="small">核心人物（度数最高前20%）</label>
          <div class="taglist" id="coreList"></div>
        </div>
      </div>
    </div>

  </div>
</div>

(function () {
  "use strict";

  /* ============================================================
     1. 解析 CSV 边数据 -> 节点 / 邻接表
     ============================================================ */
  const lines = EDGE_RAW.trim().split("\n");
  const nameToId = {};
  const nodes = [];
  const edgeKeySet = new Set();
  const edges = [];       // {a,b,lineEl}
  const edgeByKey = {};   // "min_max" -> edge

  function getId(name) {
    if (!(name in nameToId)) {
      nameToId[name] = nodes.length;
      nodes.push({
        id: nodes.length, name: name, neighbors: [],
        geoX: 0, geoY: 0, x: 0, y: 0, vx: 0, vy: 0,
        pinned: false, degree: 0, cls: "edge",
        circleEl: null, labelEl: null
      });
    }
    return nameToId[name];
  }

  lines.forEach(function (line) {
    if (!line.trim()) return;
    const parts = line.split(",");
    const a = parts[0], b = parts[1];
    const ia = getId(a), ib = getId(b);
    if (ia === ib) return;
    const key = ia < ib ? ia + "_" + ib : ib + "_" + ia;
    if (edgeKeySet.has(key)) return;
    edgeKeySet.add(key);
    const e = { a: ia, b: ib, lineEl: null };
    edges.push(e);
    edgeByKey[key] = e;
    nodes[ia].neighbors.push(ib);
    nodes[ib].neighbors.push(ia);
  });

  const N = nodes.length;
  nodes.forEach(function (nd) { nd.degree = nd.neighbors.length; });

  /* ============================================================
     2. 随机地理坐标（对应需求(2)：个人信息含地理坐标，随机函数生成）
     ============================================================ */
  nodes.forEach(function (nd) {
    nd.geoX = Math.random() * 100;
    nd.geoY = Math.random() * 100;
  });

  /* ============================================================
     3. 度数分类：核心 / 活跃 / 边缘（对应需求(5)，规则与Java版NetworkAnalyzer.classifyPeople一致）
     ============================================================ */
  const sortedByDegree = nodes.slice().sort(function (a, b) { return b.degree - a.degree; });
  const coreEnd = Math.ceil(N * 0.2);
  const activeEnd = Math.ceil(N * 0.7);
  sortedByDegree.forEach(function (nd, i) {
    nd.cls = i < coreEnd ? "core" : (i < activeEnd ? "active" : "edge");
  });

  /* ============================================================
     4. BFS 最短路径（对应需求(3)，逻辑与PathFinder.findShortestPath一致）
     ============================================================ */
  function bfsPath(startId, endId) {
    const visited = new Array(N).fill(false);
    const pre = new Array(N).fill(-1);
    const queue = [startId];
    visited[startId] = true;
    let qi = 0;
    while (qi < queue.length) {
      const v = queue[qi++];
      if (v === endId) break;
      const nb = nodes[v].neighbors;
      for (let k = 0; k < nb.length; k++) {
        const w = nb[k];
        if (!visited[w]) { visited[w] = true; pre[w] = v; queue.push(w); }
      }
    }
    if (!visited[endId]) return null;
    const path = [];
    let cur = endId;
    while (cur !== -1) { path.unshift(cur); cur = pre[cur]; }
    return path;
  }

  /* ============================================================
     5. 跳数限制BFS（对应需求(4)下半：经过k个中间人可达的人）
     ============================================================ */
  function bfsHops(startId, maxHop) {
    const dist = new Array(N).fill(-1);
    dist[startId] = 0;
    const queue = [startId];
    let qi = 0;
    while (qi < queue.length) {
      const v = queue[qi++];
      if (dist[v] >= maxHop) continue;
      const nb = nodes[v].neighbors;
      for (let k = 0; k < nb.length; k++) {
        const w = nb[k];
        if (dist[w] === -1) { dist[w] = dist[v] + 1; queue.push(w); }
      }
    }
    return dist;
  }

  function geoDist(nd1, nd2) {
    const dx = nd1.geoX - nd2.geoX, dy = nd1.geoY - nd2.geoY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* ============================================================
     6. 坐标映射：geo(0~100) -> svg viewBox
     ============================================================ */
  const VB_W = 1400, VB_H = 1000, PADX = 90, PADY = 90;
  const SCALE_X = (VB_W - 2 * PADX) / 100;
  const SCALE_Y = (VB_H - 2 * PADY) / 100;
  function geoToSvg(nd) {
    return { x: PADX + nd.geoX * SCALE_X, y: PADY + nd.geoY * SCALE_Y };
  }
  nodes.forEach(function (nd) {
    const p = geoToSvg(nd);
    nd.x = p.x; nd.y = p.y;
  });

  /* ============================================================
     7. SVG 初始渲染
     ============================================================ */
  const svg = document.getElementById("svg");
  const viewport = document.getElementById("viewport");
  const edgeLayer = document.getElementById("edgeLayer");
  const nodeLayer = document.getElementById("nodeLayer");
  const labelLayer = document.getElementById("labelLayer");
  const scanLayer = document.getElementById("scanLayer");
  const NS = "http://www.w3.org/2000/svg";

  function radiusOf(nd) { return nd.cls === "core" ? 8 : (nd.cls === "active" ? 5.5 : 3.5); }
  function colorOf(nd) { return nd.cls === "core" ? "var(--copper)" : (nd.cls === "active" ? "var(--cyan)" : "var(--muted2)"); }

  edges.forEach(function (e) {
    const line = document.createElementNS(NS, "line");
    line.setAttribute("class", "edge-line");
    line.setAttribute("x1", nodes[e.a].x); line.setAttribute("y1", nodes[e.a].y);
    line.setAttribute("x2", nodes[e.b].x); line.setAttribute("y2", nodes[e.b].y);
    edgeLayer.appendChild(line);
    e.lineEl = line;
  });

  nodes.forEach(function (nd) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", radiusOf(nd));
    c.setAttribute("cx", nd.x); c.setAttribute("cy", nd.y);
    c.setAttribute("fill", colorOf(nd));
    c.setAttribute("stroke", "#04070a");
    c.setAttribute("stroke-width", "1");
    c.style.cursor = "pointer";
    nodeLayer.appendChild(c);
    nd.circleEl = c;

    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "node-label");
    t.setAttribute("x", nd.x + radiusOf(nd) + 3);
    t.setAttribute("y", nd.y + 3);
    t.textContent = nd.name;
    labelLayer.appendChild(t);
    nd.labelEl = t;

    c.addEventListener("mousedown", function (e) { startNodeDrag(nd, e); });
  });

  function updateNodeVisual(nd) {
    nd.circleEl.setAttribute("cx", nd.x);
    nd.circleEl.setAttribute("cy", nd.y);
    nd.labelEl.setAttribute("x", nd.x + radiusOf(nd) + 3);
    nd.labelEl.setAttribute("y", nd.y + 3);
    nd.neighbors.forEach(function (wid) {
      const key = nd.id < wid ? nd.id + "_" + wid : wid + "_" + nd.id;
      const e = edgeByKey[key];
      if (!e) return;
      e.lineEl.setAttribute("x1", nodes[e.a].x); e.lineEl.setAttribute("y1", nodes[e.a].y);
      e.lineEl.setAttribute("x2", nodes[e.b].x); e.lineEl.setAttribute("y2", nodes[e.b].y);
    });
    if (selectedId !== null && (nd.id === selectedId)) updateScanRing();
  }

  /* ============================================================
     8. 简易力导向布局（不依赖任何外部库，纯手写）
     ============================================================ */
  let mode = "topo";
  let alpha = 1, simRunning = false;
  const REPULSE_K = 2600, SPRING_L = 78, SPRING_K = 0.02, CENTER_K = 0.006, DAMP = 0.82, MAX_SPEED = 18;

  function forceTick() {
    if (mode !== "topo" || !simRunning) return;
    const cx = VB_W / 2, cy = VB_H / 2;
    const ax = new Array(N).fill(0), ay = new Array(N).fill(0);

    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        let d2 = dx * dx + dy * dy + 0.01;
        let d = Math.sqrt(d2);
        let f = (REPULSE_K / d2) * alpha;
        let fx = (dx / d) * f, fy = (dy / d) * f;
        ax[i] += fx; ay[i] += fy;
        ax[j] -= fx; ay[j] -= fy;
      }
    }
    edges.forEach(function (e) {
      const A = nodes[e.a], B = nodes[e.b];
      let dx = B.x - A.x, dy = B.y - A.y;
      let d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      let f = (d - SPRING_L) * SPRING_K * alpha;
      let fx = (dx / d) * f, fy = (dy / d) * f;
      ax[e.a] += fx; ay[e.a] += fy;
      ax[e.b] -= fx; ay[e.b] -= fy;
    });

    let maxV = 0;
    for (let i = 0; i < N; i++) {
      const nd = nodes[i];
      if (nd.pinned) { nd.vx = 0; nd.vy = 0; continue; }
      ax[i] += (cx - nd.x) * CENTER_K * alpha;
      ay[i] += (cy - nd.y) * CENTER_K * alpha;
      nd.vx = (nd.vx + ax[i]) * DAMP;
      nd.vy = (nd.vy + ay[i]) * DAMP;
      const speed = Math.sqrt(nd.vx * nd.vx + nd.vy * nd.vy);
      if (speed > MAX_SPEED) { nd.vx = (nd.vx / speed) * MAX_SPEED; nd.vy = (nd.vy / speed) * MAX_SPEED; }
      nd.x += nd.vx;
      nd.y += nd.vy;
      maxV = Math.max(maxV, Math.abs(nd.vx), Math.abs(nd.vy));
    }
    nodes.forEach(updateNodeVisual);

    alpha *= 0.992;
    if (alpha < 0.01 && maxV < 0.02) { simRunning = false; return; }
    requestAnimationFrame(forceTick);
  }
  function wakeSim() { if (mode === "topo") { alpha = 1; if (!simRunning) { simRunning = true; requestAnimationFrame(forceTick); } } }

  /* 简易缓动过渡：切换到地理视图时，节点从当前位置滑动到真实地理坐标 */
  function tweenTo(nd, tx, ty, dur) {
    const sx = nd.x, sy = nd.y, st = performance.now();
    function step(now) {
      let t = Math.min(1, (now - st) / dur);
      let e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      nd.x = sx + (tx - sx) * e;
      nd.y = sy + (ty - sy) * e;
      updateNodeVisual(nd);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ============================================================
     9. 缩放 / 平移
     ============================================================ */
  let tx = 0, ty = 0, scale = 1;
  function applyTransform() { viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")"); }
  function toViewBoxPoint(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    return { x: (clientX - rect.left) / rect.width * VB_W, y: (clientY - rect.top) / rect.height * VB_H };
  }
  function zoomAt(px, py, factor) {
    const newScale = Math.min(4, Math.max(0.25, scale * factor));
    const wx = (px - tx) / scale, wy = (py - ty) / scale;
    tx = px - wx * newScale; ty = py - wy * newScale; scale = newScale;
    applyTransform();
  }
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    const p = toViewBoxPoint(e.clientX, e.clientY);
    zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  let panning = false, panStart = null, dragMoved = false;
  svg.addEventListener("mousedown", function (e) {
    if (e.target.tagName === "circle") return;
    panning = true; dragMoved = false;
    panStart = toViewBoxPoint(e.clientX, e.clientY);
    svg.classList.add("dragging");
  });
  window.addEventListener("mousemove", function (e) {
    if (!panning) return;
    const p = toViewBoxPoint(e.clientX, e.clientY);
    tx += (p.x - panStart.x) * scale; ty += (p.y - panStart.y) * scale;
    dragMoved = true;
    applyTransform();
  });
  window.addEventListener("mouseup", function () {
    if (!panning) return;
    panning = false; svg.classList.remove("dragging");
    if (!dragMoved) { clearSelection(); }
  });

  document.getElementById("zoomIn").addEventListener("click", function () { zoomAt(VB_W / 2, VB_H / 2, 1.2); });
  document.getElementById("zoomOut").addEventListener("click", function () { zoomAt(VB_W / 2, VB_H / 2, 0.83); });
  document.getElementById("zoomReset").addEventListener("click", resetView);
  function resetView() { tx = 0; ty = 0; scale = 1; applyTransform(); }

  /* ============================================================
     10. 节点拖拽（地理视图下拖动=真实修改坐标，模拟"位置移动"）
     ============================================================ */
  let dragNode = null, dragLastClient = null, nodeDragMoved = false;
  function startNodeDrag(nd, e) {
    e.stopPropagation();
    dragNode = nd; dragLastClient = { x: e.clientX, y: e.clientY }; nodeDragMoved = false;
    nd.pinned = true;
  }
  window.addEventListener("mousemove", function (e) {
    if (!dragNode) return;
    const rect = svg.getBoundingClientRect();
    const dxScreen = e.clientX - dragLastClient.x, dyScreen = e.clientY - dragLastClient.y;
    if (Math.abs(dxScreen) > 1 || Math.abs(dyScreen) > 1) nodeDragMoved = true;
    const dx = dxScreen / rect.width * VB_W / scale;
    const dy = dyScreen / rect.height * VB_H / scale;
    dragLastClient = { x: e.clientX, y: e.clientY };
    dragNode.x += dx; dragNode.y += dy;

    if (mode === "geo") {
      // 地理视图：拖动=真实修改这个人的地理坐标，触发"位置动态变化"逻辑
      dragNode.geoX = Math.min(100, Math.max(0, (dragNode.x - PADX) / SCALE_X));
      dragNode.geoY = Math.min(100, Math.max(0, (dragNode.y - PADY) / SCALE_Y));
    }
    updateNodeVisual(dragNode);
    if (selectedId !== null) refreshNearbyPanel();  // 实时刷新"附近信号"结果
  });
  window.addEventListener("mouseup", function () {
    if (dragNode) {
      dragNode.pinned = false;
      if (!nodeDragMoved) selectNode(dragNode.id);
      wakeSim();
    }
    dragNode = null;
  });

  /* ============================================================
     11. 视图模式切换
     ============================================================ */
  document.querySelectorAll("#viewSeg button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#viewSeg button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      mode = btn.dataset.view;
      if (mode === "geo") {
        simRunning = false;
        nodes.forEach(function (nd) { const p = geoToSvg(nd); tweenTo(nd, p.x, p.y, 550); });
      } else {
        wakeSim();
      }
      updateScanRing();
      renderStatusbar();
    });
  });

  /* ============================================================
     12. 选中 / 高亮 / 面板刷新
     ============================================================ */
  let selectedId = null;
  let pathEdgeKeys = new Set();
  let pathNodeIds = new Set();

  function refreshEdgeStyles() {
    edges.forEach(function (e) {
      const key = e.a < e.b ? e.a + "_" + e.b : e.b + "_" + e.a;
      const cls = ["edge-line"];
      if (pathEdgeKeys.has(key)) cls.push("path-highlight");
      else if (selectedId !== null && (e.a === selectedId || e.b === selectedId)) cls.push("circle-highlight");
      else if (selectedId !== null || pathEdgeKeys.size) cls.push("dim");
      e.lineEl.setAttribute("class", cls.join(" "));
    });
    nodes.forEach(function (nd) {
      nd.labelEl.setAttribute("class", "node-label" + (nd.id === selectedId || pathNodeIds.has(nd.id) ? " selected" : ""));
    });
  }

  function tag(nd, colorClass, clickable) {
    const cls = "tag" + (colorClass ? " " + colorClass : "");
    return '<span class="' + cls + '" data-id="' + nd.id + '">' + nd.name + "</span>";
  }
  function bindTagClicks(container) {
    container.querySelectorAll(".tag[data-id]").forEach(function (el) {
      el.addEventListener("click", function () { selectNode(parseInt(el.dataset.id, 10)); });
    });
  }

  function clsLabel(cls) { return cls === "core" ? "核心人物" : (cls === "active" ? "活跃人物" : "边缘人物"); }
  function clsBadgeClass(cls) { return cls === "core" ? "core" : (cls === "active" ? "active" : "edge"); }

  function selectNode(id, keepPath) {
    selectedId = id;
    if (!keepPath) { pathEdgeKeys = new Set(); pathNodeIds = new Set(); document.getElementById("pathResult").innerHTML = ""; }
    refreshEdgeStyles();
    renderDetail();
    renderCircle();
    refreshNearbyPanel();
    updateScanRing();
    renderStatusbar();
  }
  function clearSelection() {
    selectedId = null; pathEdgeKeys = new Set(); pathNodeIds = new Set();
    refreshEdgeStyles();
    document.getElementById("detailBody").innerHTML = '<span class="empty">点击图中任意节点查看详情</span>';
    document.getElementById("circleBody").innerHTML = '<span class="empty">选中一个节点后显示其直接联系人</span>';
    document.getElementById("nearbyBody").innerHTML = '<span class="empty">先在图中选中一个节点</span>';
    document.getElementById("pathResult").innerHTML = "";
    updateScanRing();
    renderStatusbar();
  }

  /* ---- 需求(1)(2)：节点详情 ---- */
  function renderDetail() {
    const nd = nodes[selectedId];
    document.getElementById("detailBody").innerHTML =
      '<div class="kv"><span class="k">名称</span><span class="v">' + nd.name + '</span></div>' +
      '<div class="kv"><span class="k">地理坐标</span><span class="v">(' + nd.geoX.toFixed(2) + ', ' + nd.geoY.toFixed(2) + ')</span></div>' +
      '<div class="kv"><span class="k">度数</span><span class="v">' + nd.degree + '</span></div>' +
      '<div class="kv"><span class="k">分类</span><span class="v"><span class="badge ' + clsBadgeClass(nd.cls) + '">' + clsLabel(nd.cls) + '</span></span></div>';
  }

  /* ---- 需求(6)：交往圈子 ---- */
  function renderCircle() {
    const nd = nodes[selectedId];
    const box = document.getElementById("circleBody");
    if (nd.neighbors.length === 0) { box.innerHTML = '<span class="empty">该节点没有直接联系人</span>'; return; }
    box.innerHTML = '<div class="kv"><span class="k">直接联系人</span><span class="v">' + nd.neighbors.length + ' 人</span></div>' +
      '<div class="taglist">' + nd.neighbors.map(function (id) { return tag(nodes[id]); }).join("") + '</div>';
    bindTagClicks(box);
  }

  /* ---- 需求(4)：附近信号 + 1个中间人可达 ---- */
  function refreshNearbyPanel() {
    const box = document.getElementById("nearbyBody");
    if (selectedId === null) { box.innerHTML = '<span class="empty">先在图中选中一个节点</span>'; return; }
    const nd = nodes[selectedId];
    const r = parseInt(document.getElementById("radiusSlider").value, 10);
    const nearby = nodes.filter(function (other) { return geoDist(other, nd) <= r; });
    const hopDist = bfsHops(selectedId, 2);
    const oneInterm = nodes.filter(function (other, idx) { return hopDist[other.id] === 2; });

    box.innerHTML =
      '<div class="kv"><span class="k">半径 ' + r + ' 内共</span><span class="v" style="color:var(--teal)">' + nearby.length + ' 人</span></div>' +
      '<div class="taglist">' + nearby.map(function (nd2) { return tag(nd2, "teal"); }).join("") + '</div>' +
      '<div class="kv" style="margin-top:10px"><span class="k">经1个中间人可达</span><span class="v" style="color:var(--copper)">' + oneInterm.length + ' 人</span></div>' +
      '<div class="taglist">' + (oneInterm.length ? oneInterm.map(function (nd2) { return tag(nd2, "copper"); }).join("") : '<span class="empty">无</span>') + '</div>';
    bindTagClicks(box);
    updateScanRing();
  }

  /* ---- 扫描半径圈（signature动效，只在地理视图下绘制真实几何圆） ---- */
  let scanOn = false;
  function updateScanRing() {
    scanLayer.innerHTML = "";
    if (!scanOn || selectedId === null || mode !== "geo") return;
    const nd = nodes[selectedId];
    const r = parseInt(document.getElementById("radiusSlider").value, 10);
    const svgR = r * (SCALE_X + SCALE_Y) / 2;

    const staticRing = document.createElementNS(NS, "circle");
    staticRing.setAttribute("cx", nd.x); staticRing.setAttribute("cy", nd.y);
    staticRing.setAttribute("r", svgR);
    staticRing.setAttribute("fill", "rgba(89,230,176,0.05)");
    staticRing.setAttribute("stroke", "var(--teal)");
    staticRing.setAttribute("stroke-width", "1");
    staticRing.setAttribute("stroke-dasharray", "4 3");
    scanLayer.appendChild(staticRing);

    const ping = document.createElementNS(NS, "circle");
    ping.setAttribute("cx", nd.x); ping.setAttribute("cy", nd.y);
    ping.setAttribute("r", "4"); ping.setAttribute("fill", "none");
    ping.setAttribute("stroke", "var(--teal)"); ping.setAttribute("stroke-width", "1.4");
    const anR = document.createElementNS(NS, "animate");
    anR.setAttribute("attributeName", "r"); anR.setAttribute("values", "4;" + svgR);
    anR.setAttribute("dur", "1.8s"); anR.setAttribute("repeatCount", "indefinite");
    const anO = document.createElementNS(NS, "animate");
    anO.setAttribute("attributeName", "opacity"); anO.setAttribute("values", "0.65;0");
    anO.setAttribute("dur", "1.8s"); anO.setAttribute("repeatCount", "indefinite");
    ping.appendChild(anR); ping.appendChild(anO);
    scanLayer.appendChild(ping);
  }
  document.getElementById("scanToggle").addEventListener("click", function () {
    scanOn = !scanOn;
    this.classList.toggle("on", scanOn);
    updateScanRing();
  });
  document.getElementById("radiusSlider").addEventListener("input", function () {
    document.getElementById("radiusVal").textContent = this.value;
    refreshNearbyPanel();
  });

  /* ---- 需求(3)：最短路径查询 ---- */
  document.getElementById("btnPath").addEventListener("click", function () {
    const nameA = document.getElementById("pathA").value.trim();
    const nameB = document.getElementById("pathB").value.trim();
    const box = document.getElementById("pathResult");
    if (!(nameA in nameToId) || !(nameB in nameToId)) {
      box.innerHTML = '<span class="empty">名字不存在，请检查拼写（可从下拉列表中选择）</span>';
      return;
    }
    const a = nameToId[nameA], b = nameToId[nameB];
    const path = bfsPath(a, b);
    if (!path) {
      box.innerHTML = '<span class="empty">两个人一点关系没有（网络中不连通）</span>';
      pathEdgeKeys = new Set(); pathNodeIds = new Set();
      selectNode(a, true);
      return;
    }
    pathEdgeKeys = new Set();
    pathNodeIds = new Set(path);
    for (let i = 0; i < path.length - 1; i++) {
      const p = path[i], q = path[i + 1];
      pathEdgeKeys.add(p < q ? p + "_" + q : q + "_" + p);
    }
    const mid = path.length - 2;
    box.innerHTML =
      '<div class="kv"><span class="k">最少经过中间人</span><span class="v" style="color:var(--copper);font-weight:600">' + mid + ' 人</span></div>' +
      '<div class="taglist">' + path.map(function (id, i) {
        return '<span class="tag' + (i === 0 || i === path.length - 1 ? ' teal' : ' copper') + '" data-id="' + id + '">' + nodes[id].name + '</span>';
      }).join(' &rarr; ') + '</div>';
    bindTagClicks(box);
    selectNode(a, true);
  });

  /* ---- 需求(5)：核心/活跃/边缘统计 ---- */
  function renderStats() {
    const core = nodes.filter(function (n) { return n.cls === "core"; });
    const active = nodes.filter(function (n) { return n.cls === "active"; });
    const edge = nodes.filter(function (n) { return n.cls === "edge"; });
    document.getElementById("statGrid").innerHTML =
      '<div class="statcell"><div class="n" style="color:var(--copper)">' + core.length + '</div><div class="l">核心</div></div>' +
      '<div class="statcell"><div class="n" style="color:var(--cyan)">' + active.length + '</div><div class="l">活跃</div></div>' +
      '<div class="statcell"><div class="n" style="color:var(--muted)">' + edge.length + '</div><div class="l">边缘</div></div>';
    const coreSorted = core.slice().sort(function (a, b) { return b.degree - a.degree; });
    const box = document.getElementById("coreList");
    box.innerHTML = coreSorted.map(function (nd) { return tag(nd, "copper"); }).join("");
    bindTagClicks(box);
  }

  /* ---- 面板折叠 ---- */
  document.querySelectorAll(".panel > .ph").forEach(function (h) {
    h.addEventListener("click", function () { h.parentElement.classList.toggle("collapsed"); });
  });

  /* ---- 搜索自动补全 ---- */
  const datalist = document.getElementById("nameList");
  nodes.forEach(function (nd) {
    const opt = document.createElement("option");
    opt.value = nd.name; datalist.appendChild(opt);
  });

  /* ---- 状态栏 ---- */
  function renderStatusbar() {
    const modeLabel = mode === "topo" ? "拓扑视图" : "地理视图";
    const sel = selectedId !== null ? nodes[selectedId].name : "无";
    document.getElementById("statusbar").innerHTML =
      "<b>节点</b> " + N + " &nbsp; <b>关系</b> " + edges.length +
      " &nbsp; <b>视图</b> " + modeLabel + " &nbsp; <b>缩放</b> " + scale.toFixed(2) + "x &nbsp; <b>选中</b> " + sel;
  }

  /* ============================================================
     13. 键盘操作
     ============================================================ */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    switch (e.key) {
      case "ArrowUp": ty += 45; applyTransform(); break;
      case "ArrowDown": ty -= 45; applyTransform(); break;
      case "ArrowLeft": tx += 45; applyTransform(); break;
      case "ArrowRight": tx -= 45; applyTransform(); break;
      case "+": case "=": zoomAt(VB_W / 2, VB_H / 2, 1.15); break;
      case "-": case "_": zoomAt(VB_W / 2, VB_H / 2, 0.87); break;
      case "Escape": clearSelection(); resetView(); break;
      case "/": e.preventDefault(); document.getElementById("pathA").focus(); break;
    }
  });

  /* ============================================================
     14. 启动
     ============================================================ */
  applyTransform();
  refreshEdgeStyles();
  renderStats();
  renderStatusbar();
  wakeSim();

})();

</script>
</body>
</html>
